    [-72.0,41.0],[-71.4,41.5],[-70.5,41.8],[-70.0,42.0],[-70.5,43.0],
    [-69.0,44.0],[-67.0,44.8],[-67.0,47.2],[-69.0,47.4],[-71.5,45.0],
    [-74.0,45.0],[-76.5,44.0],[-79.0,43.3],[-79.0,42.5],[-82.5,42.0],
    [-83.5,42.0],[-84.0,41.7],[-84.8,41.7],[-84.8,42.5],[-83.0,43.5],
    [-82.5,44.5],[-82.5,45.5],[-83.5,46.0],[-84.5,46.5],[-85.0,46.8],
    [-86.5,46.5],[-87.5,46.5],[-88.0,47.0],[-89.5,47.0],[-90.5,47.5],
    [-91.5,47.0],[-92.0,46.8],[-92.5,46.0],[-92.0,45.5],[-90.0,44.0],
    [-87.5,43.5],[-87.5,42.5],[-87.8,42.0],[-87.5,41.7],[-87.0,42.0],
    [-86.5,42.0],[-86.0,42.0],[-84.8,41.7],[-84.0,41.7],[-83.5,42.0],
    [-82.5,42.0],[-79.0,42.5],[-79.0,43.3],[-76.5,44.0],
    [-76.5,43.5],[-76.0,43.5],[-75.5,44.5],[-74.0,45.0],[-71.5,45.0],
    [-69.0,47.4],[-67.0,47.2],[-67.0,44.8]
  ];

  // This outline is rough — draw just the main perimeter
  const simplified = [
    [-124.7,48.4],[-124.2,46.3],[-124.4,42.0],[-124.3,40.0],
    [-122.5,37.8],[-121.0,35.5],[-120.0,34.0],[-117.1,32.5],
    [-114.7,32.7],[-111.0,31.3],[-106.4,31.8],[-104.4,29.8],
    [-100.0,28.0],[-97.2,26.0],[-97.4,27.8],[-95.0,29.5],
    [-89.5,30.0],[-85.5,30.0],[-83.0,29.0],[-82.0,27.0],
    [-80.5,25.1],[-80.0,27.0],[-81.3,30.5],[-80.8,32.0],
    [-78.5,33.8],[-75.5,35.5],[-75.5,38.5],[-74.0,40.5],
    [-71.5,41.3],[-70.0,42.0],[-67.0,44.8],[-67.0,47.2],

    [-117.0,49.0],[-122.5,48.5],[-124.7,48.4]
  ];

  function toCanvas(lng, lat) {
    const px = project(lat, lng);
    return [px.x / 100 * w, px.y / 100 * h];
  }

  ctx.beginPath();
  const [sx, sy] = toCanvas(simplified[0][0], simplified[0][1]);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < simplified.length; i++) {
    const [cx, cy] = toCanvas(simplified[i][0], simplified[i][1]);
    ctx.lineTo(cx, cy);
  }
  ctx.closePath();
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--land').trim();
  ctx.fill();
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--land-stroke').trim();
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function createMarkers() {
  const mapEl = document.getElementById('map');
  document.querySelectorAll('.marker').forEach(m => m.remove());
  document.querySelectorAll('.region-label').forEach(l => l.remove());

  const groups = {};
  TROLLS.forEach((t, i) => {
    if (activeFilter && t.status !== activeFilter) return;
    const p = project(t.lat, t.lng);
    const key = Math.round(p.x / 3) + ',' + Math.round(p.y / 3);
    if (!groups[key]) groups[key] = [];
    groups[key].push({ ...t, idx: i, px: p.x, py: p.y });
  });

  Object.values(groups).forEach(group => {
    const cx = group.reduce((s, t) => s + t.px, 0) / group.length;
    const cy = group.reduce((s, t) => s + t.py, 0) / group.length;
    const primary = group[0];
    const s = STATUS[primary.status];

    const el = document.createElement('button');
    el.className = 'marker';
    el.style.left = cx + '%';
    el.style.top = cy + '%';
    el.setAttribute('aria-label', group.length > 1 ? group.length + ' trolls near ' + primary.loc : primary.name);
    el.innerHTML = `<div class="marker-dot" style="background:${s.color};border-color:${s.color}">${s.emoji}${group.length > 1 ? '<span class="marker-count">' + group.length + '</span>' : ''}</div>`;

    el.addEventListener('click', () => showPopup(group));
    mapEl.appendChild(el);
  });

  const regions = [
    { label: "Pacific Northwest", x: 5, y: 8 },
    { label: "Mountain West", x: 22, y: 28 },
    { label: "Midwest", x: 52, y: 22 },
    { label: "Northeast", x: 80, y: 18 },
    { label: "Southeast", x: 68, y: 55 },
    { label: "Southwest", x: 30, y: 65 },
  ];
  regions.forEach(r => {
    const lbl = document.createElement('div');
    lbl.className = 'region-label';
    lbl.style.left = r.x + '%';
    lbl.style.top = r.y + '%';
    lbl.textContent = r.label;
    mapEl.appendChild(lbl);
  });
}

function showPopup(trolls) {
  const el = document.getElementById('popup');
  const content = document.getElementById('popup-content');
  const html = trolls.map(t => {
    const s = STATUS[t.status];
    return `
      <h2>${t.name}</h2>
      <div class="popup-loc">${t.loc}, ${t.state}</div>
      <div class="popup-desc">${t.desc}</div>
      <div class="popup-status" style="background:${s.color}">${s.emoji} ${s.label}</div>
      ${trolls.length > 1 && t !== trolls[trolls.length - 1] ? '<hr style="border:none;border-top:1px solid var(--card-border);margin:18px 0">' : ''}
    `;
  }).join('');
  content.innerHTML = html + '<div class="popup-tip">Confirm hours and directions at <a href="https://thomasdambo.com" target="_blank" rel="noopener">thomasdambo.com</a> before visiting.</div>';
  el.classList.add('open');
}

function closePopup(e) {
  if (e.target === document.getElementById('popup')) {
    document.getElementById('popup').classList.remove('open');
  }
}

function buildControls() {
  const el = document.getElementById('controls');
  const allBtn = `<button class="filter-btn${!activeFilter ? ' active' : ''}" onclick="setFilter(null)">All Trolls</button>`;
  const statusBtns = Object.entries(STATUS).map(([key, s]) =>
    `<button class="filter-btn${activeFilter === key ? ' active' : ''}" onclick="setFilter('${key}')"><span class="filter-dot" style="background:${s.color}"></span>${s.label}</button>`
  ).join('');
  el.innerHTML = allBtn + statusBtns;
}

function setFilter(key) {
  activeFilter = key;
  buildControls();
  createMarkers();
  buildList();
}

function buildStats() {
  const visible = TROLLS.filter(t => !activeFilter || t.status === activeFilter);
  const states = new Set(visible.map(t => t.state)).size;
  document.getElementById('stats').innerHTML = `
    <div class="stat-item"><div class="stat-num">${visible.length}</div><div class="stat-label">Trolls</div></div>
    <div class="stat-item"><div class="stat-num">${states}</div><div class="stat-label">States</div></div>
    <div class="stat-item"><div class="stat-num">${visible.filter(t => t.status === 'permanent').length}</div><div class="stat-label">Permanent</div></div>
  `;
}

function buildList() {
  const section = document.getElementById('troll-list');
  const heading = section.querySelector('h2');
  section.innerHTML = '';
  section.appendChild(heading);
  buildStats();

  const filtered = TROLLS.filter(t => !activeFilter || t.status === activeFilter);
  const byState = {};
  filtered.forEach(t => {
    if (!byState[t.state]) byState[t.state] = [];
    byState[t.state].push(t);
  });

  Object.keys(byState).sort().forEach(state => {
    const group = document.createElement('div');
    group.className = 'state-group';
    group.innerHTML = `<div class="state-name">${state}</div>` +
      byState[state].map(t => {
        const s = STATUS[t.status];
        return `<div class="troll-row" onclick='showPopup(${JSON.stringify([t]).replace(/'/g,"&#39;")})'>
          <span class="troll-row-dot" style="background:${s.color}"></span>
          <div class="troll-row-text">
            <div class="troll-row-name">${t.name}</div>
            <div class="troll-row-loc">${t.loc}</div>
          </div>
          <span class="troll-row-badge" style="background:${s.color}">${s.label}</span>
        </div>`;
      }).join('');
    section.appendChild(group);
  });
}

function init() {
  drawMap();
  buildControls();
  buildStats();
  createMarkers();
  buildList();
  window.addEventListener('resize', () => { drawMap(); });
  const ro = new ResizeObserver(() => drawMap());
  ro.observe(document.getElementById('canvas').parentElement);
}

init();
</script>
