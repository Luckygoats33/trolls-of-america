<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trolls of America</title>
<meta name="description" content="Interactive map of Thomas Dambo's giant recycled-wood troll sculptures hidden across the United States. Find all 35+ trolls in 21 states.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f7f1e3;--bg-dark:#ede5d2;--fg:#2a1f0e;--fg-muted:#7a6e5a;
  --accent:#3d7a28;--accent-light:#5a9e3e;--accent-glow:rgba(61,122,40,0.2);
  --wood:#8b6914;--wood-light:#c4a04a;
  --card:#fffdf7;--card-border:#e0d5be;
  --permanent:#3d7a28;--seasonal:#c48a11;--temporary:#c44b2b;--planned:#6878a0;
  --header-bg:#1a3a0e;--header-fg:#f0e8d0;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a170e;--bg-dark:#13110a;--fg:#e0d8c0;--fg-muted:#8a7e64;
    --accent:#5a9e3e;--accent-light:#7abb5e;--accent-glow:rgba(90,158,62,0.25);
    --wood:#c4a04a;--wood-light:#d4b86a;
    --card:#242018;--card-border:#3a3220;
    --permanent:#5a9e3e;--seasonal:#d4a020;--temporary:#e06040;--planned:#8a9abe;
    --header-bg:#0d1a08;--header-fg:#d0c8a8;
    color-scheme:dark;
  }
}
html,body{margin:0;padding:0;height:100%;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;overflow:hidden}

.site-header{
  background:var(--header-bg);color:var(--header-fg);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:100;
}
.header-icon{font-size:26px;line-height:1}
.header-text h1{
  font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;margin:0;line-height:1.2;
  background:linear-gradient(135deg,#7abb5e,#d4b86a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header-text p{margin:0;font-size:11px;opacity:0.7}
.header-stats{margin-left:auto;display:flex;gap:14px;font-variant-numeric:tabular-nums}
.header-stat{text-align:center}
.header-stat-num{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;color:var(--accent-light);line-height:1}
.header-stat-label{font-size:9px;text-transform:uppercase;letter-spacing:0.07em;opacity:0.6}

.region-tabs{
  display:flex;gap:0;flex-shrink:0;overflow-x:auto;
  background:var(--bg-dark);border-bottom:1px solid var(--card-border);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.region-tabs::-webkit-scrollbar{display:none}
.region-tab{
  flex:1;min-width:0;padding:9px 8px;border:none;background:none;
  font-family:'Fredoka',sans-serif;font-size:12px;font-weight:500;
  color:var(--fg-muted);cursor:pointer;white-space:nowrap;
  border-bottom:3px solid transparent;transition:all 0.2s;text-align:center;
}
.region-tab:hover{color:var(--fg);background:rgba(61,122,40,0.05)}
.region-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-count{
  display:inline-block;background:var(--accent-glow);color:var(--accent);
  font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:3px;
}

.map-container{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%;z-index:1}
.leaflet-tile-pane{filter:sepia(0.12) saturate(1.08) brightness(1.02)}
.leaflet-control-zoom a{
  background:var(--card)!important;color:var(--fg)!important;
  border-color:var(--card-border)!important;
  font-family:'Fredoka',sans-serif!important;font-size:18px!important;
}
.leaflet-control-zoom a:hover{background:var(--bg-dark)!important}
.leaflet-popup{display:none!important}

.troll-marker{position:relative;cursor:pointer;transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.troll-marker:hover{transform:scale(1.3)}
.troll-marker-img{
  width:46px;height:46px;border-radius:50%;object-fit:cover;
  border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:block;
}
.troll-marker-ring{
  position:absolute;inset:-5px;border-radius:50%;
  border:2px solid var(--accent);opacity:0.5;
  animation:mpulse 2.5s ease-out infinite;
}
@keyframes mpulse{0%{transform:scale(0.9);opacity:0.5}100%{transform:scale(1.5);opacity:0}}

/* Detail Panel */
.detail-overlay{
  position:absolute;inset:0;z-index:500;
  display:flex;align-items:stretch;justify-content:flex-end;
  pointer-events:none;opacity:0;transition:opacity 0.25s;
}
.detail-overlay.open{opacity:1;pointer-events:auto}
.detail-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.35);cursor:pointer}
.detail-panel{
  position:relative;width:50%;max-width:460px;
  background:var(--card);box-shadow:-4px 0 32px rgba(0,0,0,0.15);
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform 0.35s cubic-bezier(0.22,1,0.36,1);
  overflow:hidden;
}
.detail-overlay.open .detail-panel{transform:translateX(0)}
.detail-close{
  position:absolute;top:10px;right:10px;z-index:10;
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(0,0,0,0.5);color:#fff;font-size:22px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);transition:background 0.2s;
}
.detail-close:hover{background:rgba(0,0,0,0.7)}
.detail-img{width:100%;aspect-ratio:1;object-fit:cover;flex-shrink:0;display:block}
.detail-body{padding:18px 20px;flex:1;overflow-y:auto}
.detail-body h2{font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;margin:0 0 4px;line-height:1.2}
.detail-loc{color:var(--fg-muted);font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.detail-loc svg{flex-shrink:0}
.detail-desc{font-size:15px;line-height:1.6;margin-bottom:14px}
.detail-status{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Fredoka',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:0.03em;text-transform:uppercase;
  padding:5px 14px;border-radius:20px;color:#fff;
}
.detail-tip{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--card-border);
  font-size:12px;color:var(--fg-muted);line-height:1.5;
}
.detail-tip a{color:var(--accent);text-decoration:none}
.detail-tip a:hover{text-decoration:underline}

@media(max-width:700px){
  .header-stats{display:none}
  .header-text h1{font-size:16px}
  .region-tab{font-size:11px;padding:8px 6px}
  .troll-marker-img{width:38px;height:38px;border-width:2px}
  .troll-marker-ring{inset:-4px}
  .detail-overlay{align-items:flex-end;justify-content:stretch}
  .detail-panel{
    width:100%;max-width:none;max-height:60vh;
    border-radius:16px 16px 0 0;
    transform:translateY(100%);
  }
  .detail-overlay.open .detail-panel{transform:translateY(0)}
  .detail-img{aspect-ratio:16/9;max-height:180px}
  .detail-body h2{font-size:19px}
  .detail-body{padding:14px 16px}
}
@media(prefers-reduced-motion:reduce){
  .troll-marker-ring{animation:none}
  .detail-panel,.detail-overlay{transition-duration:0.01s}
}
</style>
</head>

let map,markers=[],aR='all';

function init(){
  map=L.map('map',{center:[39.5,-98.5],zoom:4,zoomControl:false,maxBounds:[[-5,-180],[72,-30]],minZoom:3,maxZoom:18});
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19
  }).addTo(map);
  buildTabs();addMarkers();
}

function buildTabs(){
  const nav=document.getElementById('tabs');
  const ct={all:T.length};
  T.forEach(t=>{ct[t.r]=(ct[t.r]||0)+1});
  nav.innerHTML=Object.entries(R).map(([k,r])=>
    '<button class="region-tab'+(k===aR?' active':'')+'" onclick="setR(\''+k+'\')">'+r.l+'<span class="tab-count">'+(ct[k]||0)+'</span></button>'
  ).join('');
}

function setR(k){
  aR=k;buildTabs();
  const r=R[k];
  map.flyTo(r.c,r.z,{duration:0.8});
  markers.forEach(m=>{
    const t=T[m._ti];
    if(k==='all'||t.r===k)m.addTo(map);else map.removeLayer(m);
  });
}

function addMarkers(){
  T.forEach((t,idx)=>{
    const s=S[t.st];
    const img=I[t.i]||I[0];
    const html='<div class="troll-marker"><div class="troll-marker-ring" style="border-color:'+s.h+'"></div><img class="troll-marker-img" src="'+img+'" alt="'+t.n+'" loading="lazy" style="border-color:'+s.h+'"></div>';
    const icon=L.divIcon({html:html,className:'',iconSize:[46,46],iconAnchor:[23,23]});
    const m=L.marker([t.la,t.ln],{icon:icon}).addTo(map);
    m._ti=idx;
    m.on('click',function(){openD(idx)});
    markers.push(m);
  });
}

function openD(idx){
  const t=T[idx],s=S[t.st],img=I[t.i]||I[0];
  document.getElementById('dpanel').innerHTML=
    '<button class="detail-close" onclick="closeD()" aria-label="Close">×</button>'+
    '<img class="detail-img" src="'+img+'" alt="'+t.n+'">'+
    '<div class="detail-body">'+
    '<h2>'+t.n+'</h2>'+
    '<div class="detail-loc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>'+t.l+', '+t.s+'</div>'+
    '<p class="detail-desc">'+t.d+'</p>'+
    '<span class="detail-status" style="background:'+s.c+'">'+s.l+'</span>'+
    '<div class="detail-tip">Confirm hours &amp; directions at <a href="https://thomasdambo.com" target="_blank" rel="noopener">thomasdambo.com</a> before visiting.</div>'+
    '</div>';
  document.getElementById('detail').classList.add('open');
  map.flyTo([t.la,t.ln],10,{duration:0.6});
}

function closeD(){document.getElementById('detail').classList.remove('open')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeD()});
init();
</script>
